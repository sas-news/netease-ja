name: build

on:
  workflow_dispatch: {}
  push:
    branches: [main, dev]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build patch bundle
        run: |
          chmod +x gradlew
          ./gradlew buildAndroid
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          # Classic PAT with read:packages scope, stored once as a repo secret.
          # GITHUB_TOKEN cannot cross into MorpheApp's registry, so a PAT is required.
          GITHUB_TOKEN: ${{ secrets.REGISTRY_PAT }}

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: neteaseja-mpp
          path: patches/build/libs/*.mpp
